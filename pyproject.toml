[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-market-pulse"
version = "0.1.0"
description = "MCP server exposing market-data tools (Stooq) plus a Claude-powered agentic client"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "VenkataRamana Kandi" }]
keywords = ["mcp", "model-context-protocol", "claude", "market-data", "stocks"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
urls = { Homepage = "https://github.com/venkatk1801/mcp-market-pulse" }
dependencies = [
    "mcp>=2",
    "anthropic>=0.50",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[project.scripts]
market-pulse-server = "market_pulse.server:main"
market-pulse = "market_pulse.client:main"

[tool.hatch.build.targets.wheel]
packages = ["src/market_pulse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
